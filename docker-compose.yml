# betich's tools — api + its own cloudflare tunnel.
#
#   cp .env.example .env     # fill in GOOGLE_FONTS_API_KEY if you have one
#   docker compose up -d --build
#
# The client is deployed separately to Cloudflare Pages (`bun run deploy` in
# client/). Only the API runs here, reached at https://tools-api.betich.me.

services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: tools-api
    restart: unless-stopped
    environment:
      PORT: 8787
      DATA_DIR: /data
      GOOGLE_FONTS_API_KEY: ${GOOGLE_FONTS_API_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://tools.betich.me,https://betich-tools.pages.dev,http://localhost:5173}
      MAX_BATCH_ROWS: ${MAX_BATCH_ROWS:-500}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-12582912}
      # Unlocks the usage dashboard at /admin; unset, it refuses everyone.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # The rest of the guard rails (rate limits, disk reserve, render queue)
      # have defaults in server/src/env.ts; override any of them here.
      # Uploads and font files live on the pooled USB drives (mergerfs at
      # /mnt/media); SQLite stays on the named volume, on the SD card.
      ASSETS_DIR: /bulk/assets
      FONTS_DIR: /bulk/fonts
      # Upload parts and PDF job files; swept an hour after they are last touched.
      JOBS_DIR: /bulk/jobs
      MIN_FREE_BYTES: ${MIN_FREE_BYTES:-2147483648}
      MAX_ASSET_BYTES: ${MAX_ASSET_BYTES:-21474836480}
      RENDER_CONCURRENCY: ${RENDER_CONCURRENCY:-1}
    # This box runs other services too. A runaway render is killed and
    # restarted here instead of pushing its neighbours into swap.
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 2
    pids_limit: 256
    logging: &logs
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    volumes:
      - tools-data:/data
      - ${BULK_DIR:-/mnt/media/tools}:/bulk
    # Not published to the host: the tunnel reaches it over the compose network.
    expose:
      - "8787"

  # PDF compress/merge runs here, apart from the API, so a job that blows its
  # memory takes down only itself. It shares the SQLite volume (job table,
  # heartbeat) and the bulk drives (uploads, results) with the api.
  pdf-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    # A fixed tag, whatever the compose project name, so the image can be run on its own.
    image: tools-pdf-worker:latest
    container_name: tools-pdf-worker
    restart: unless-stopped
    environment:
      WORKER_PORT: 8788
      DATA_DIR: /data
      WORK_DIR: /bulk/pdf-work
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 3
    pids_limit: 256
    logging: *logs
    volumes:
      - tools-data:/data
      - ${BULK_DIR:-/mnt/media/tools}:/bulk
    # Nothing calls it: the api reads its heartbeat from SQLite. The port is for the probe.
    expose:
      - "8788"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: tools-tunnel
    restart: unless-stopped
    # Runs as root so the mounted credentials can stay 0600 on the host; the
    # image's default non-root user cannot read them.
    user: "0:0"
    command: tunnel --config /etc/cloudflared/config.yml run
    mem_limit: 256m
    logging: *logs
    volumes:
      - ./deploy/tunnel.yml:/etc/cloudflared/config.yml:ro
      - ./deploy/tunnel-credentials.json:/etc/cloudflared/credentials.json:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  tools-data:
