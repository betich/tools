# betich's tools — api + its own cloudflare tunnel.
#
#   cp .env.example .env     # fill in GOOGLE_FONTS_API_KEY if you have one
#   docker compose up -d --build
#
# The client is deployed separately to Cloudflare Pages (`bun run deploy` in
# client/). Only the API runs here, reached at https://api.tools.betich.me.

services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: tools-api
    restart: unless-stopped
    environment:
      PORT: 8787
      DATA_DIR: /data
      GOOGLE_FONTS_API_KEY: ${GOOGLE_FONTS_API_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://tools.betich.me,https://betich-tools.pages.dev,http://localhost:5173}
      MAX_BATCH_ROWS: ${MAX_BATCH_ROWS:-500}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-12582912}
    volumes:
      - tools-data:/data
    # Not published to the host: the tunnel reaches it over the compose network.
    expose:
      - "8787"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: tools-tunnel
    restart: unless-stopped
    # Runs as root so the mounted credentials can stay 0600 on the host; the
    # image's default non-root user cannot read them.
    user: "0:0"
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./deploy/tunnel.yml:/etc/cloudflared/config.yml:ro
      - ./deploy/tunnel-credentials.json:/etc/cloudflared/credentials.json:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  tools-data:
